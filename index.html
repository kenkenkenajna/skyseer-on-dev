:root {
  color-scheme: dark;
  --night: #0d1030;
  --desk: #06071a;
  --panel: #171a45;
  --edge: #3b418f;
  --ink: #f4f0e0;
  --dim: #9297d0;
  --sun: #ffd23f;
  --aqua: #6ee7e7;
  --pink: #ff7aa8;
  --shadow: #03040f;
  --font: "Pix32", ui-monospace, "Courier New", monospace;
}
html, body { height: 100%; }
body { background: var(--desk); color: var(--ink); font: 18px/1.35 var(--font); display: grid; place-items: center;
       overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
       -webkit-font-smoothing: none; font-smooth: never; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night); }
@media (min-width: 560px) and (min-height: 520px) {
  #app { width: auto; height: min(100% - 32px, 900px); aspect-ratio: 9 / 19; max-width: calc(100% - 32px);
         border: 10px solid #23265a; border-radius: 22px; box-shadow: 0 0 0 4px var(--shadow), 10px 10px 0 4px #000; }
}
#sky, #labels { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#sky { touch-action: none; cursor: grab; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
#labels { pointer-events: none; }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
small, .small { font-size: 12px; line-height: 1.3; }

.box { background: var(--panel); border: 2px solid var(--edge); box-shadow: 4px 4px 0 var(--shadow); }
.hud { position: absolute; top: 0; left: 0; right: 0; display: grid; gap: 8px;
       padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 0; pointer-events: none; }
.hudrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; min-width: 0; }
.hudrow > * { pointer-events: auto; }
.chip { padding: 6px 10px; color: var(--sun); max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.chip.gps::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; background: var(--aqua); }
.clock { padding: 4px 10px 6px; display: grid; justify-items: end; gap: 0; font-variant-numeric: tabular-nums; }
.clock #clock-time { font-size: 24px; line-height: 1.1; color: var(--ink); }
.clock .sub { font-size: 12px; color: var(--dim); display: flex; gap: 8px; align-items: center; }
.live { color: var(--night); background: var(--aqua); padding: 0 4px; }
.live.off { background: var(--pink); }
.cond { font-size: 12px; color: var(--ink); background: #0d1030cc; padding: 2px 6px; pointer-events: none; max-width: 100%; }

.status { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 76px);
          text-align: center; color: var(--dim); font-size: 12px; pointer-events: none; text-shadow: 1px 1px 0 var(--shadow); }
.dock { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.dock button { display: grid; justify-items: center; gap: 4px; padding: 8px 2px 6px; font-size: 12px; color: var(--ink); min-width: 0; }
.dock button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }
.dock svg { width: 24px; height: 24px; fill: var(--sun); shape-rendering: crispEdges; }
.dock button[aria-pressed="true"] { background: var(--sun); color: var(--night); border-color: var(--ink); }
.dock button[aria-pressed="true"] svg { fill: var(--night); }

.sheet { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
         max-height: 62%; overflow: auto; padding: 14px 14px 16px; -webkit-user-select: text; user-select: text; z-index: 5; }
.sheet h2 { font-size: 36px; line-height: 1; font-weight: 400; color: var(--sun); margin: 0 40px 6px 0; overflow-wrap: anywhere; }
.sheet .kind { color: var(--aqua); font-size: 12px; margin: 0 0 10px; }
.sheet .now { margin: 0 0 12px; }
.sheet h3 { font-size: 12px; font-weight: 400; letter-spacing: 1px; text-transform: uppercase; color: var(--night);
            background: var(--dim); margin: 14px 0 8px; padding: 1px 6px; display: inline-block; }
.sheet dl { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 6px 12px; margin: 0; align-items: baseline; }
.sheet dt { color: var(--dim); font-size: 12px; }
.sheet dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
.sheet .fact { margin: 14px 0 0; padding: 8px 10px; border-left: 4px solid var(--pink); background: var(--night); }
.close { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; padding: 0; border: 2px solid var(--edge);
         background: var(--night); color: var(--ink); font-size: 24px; line-height: 1; }

.dlg { position: absolute; inset: 0; background: #03040fcc; display: grid; place-items: start center;
       padding: calc(env(safe-area-inset-top, 0px) + 72px) 12px 12px; z-index: 10; overflow: auto; }
.dlg .box { position: relative; width: min(100%, 400px); padding: 14px; display: grid; gap: 12px; }
.dlg h2 { font-size: 24px; line-height: 1.1; font-weight: 400; color: var(--sun); margin: 0 40px 0 0; }
.dlg p { margin: 0; color: var(--dim); font-size: 12px; line-height: 1.5; }
.dlg label { font-size: 12px; color: var(--dim); display: grid; gap: 4px; }
.dlg input, .dlg select { font: 18px var(--font); color: var(--ink); background: var(--night); border: 2px solid var(--edge);
                          border-radius: 0; padding: 8px; width: 100%; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 100px; min-width: 0; }
.btn { border: 2px solid var(--edge); background: var(--night); color: var(--ink); padding: 8px 10px; box-shadow: 3px 3px 0 var(--shadow); }
.btn.primary { background: var(--sun); color: var(--night); border-color: var(--ink); }
.results, .checks { display: grid; gap: 6px; max-height: 330px; overflow: auto; padding: 0 4px 4px 0; }
.results button, .checks button { text-align: left; background: var(--night); border: 2px solid var(--edge); padding: 8px 10px;
                                  display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.results span { color: var(--dim); font-size: 12px; }
.checks button::after { content: "OFF"; font-size: 12px; color: var(--dim); }
.checks button[aria-pressed="true"] { border-color: var(--aqua); }
.checks button[aria-pressed="true"]::after { content: "ON"; color: var(--night); background: var(--aqua); padding: 0 4px; }
.follow { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 98px); z-index: 4;
          padding: 12px; font-size: 18px; background: var(--sun); color: var(--night); border-color: var(--ink); }
.toast { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 96px); padding: 8px 10px;
         font-size: 12px; line-height: 1.5; color: var(--ink); z-index: 20; text-align: center; border-color: var(--sun); }
.game { position: absolute; inset: 0; z-index: 8; background: var(--night); display: grid; grid-template-rows: auto 1fr; gap: 12px;
        padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px); overflow: auto;
        background-image: radial-gradient(var(--edge) 1px, transparent 1px); background-size: 24px 24px; }
.gbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.gbar .tag { padding: 6px 10px; font-size: 12px; color: var(--ink); }
.gbar .tag b { font-weight: 400; color: var(--sun); font-size: 18px; margin-left: 6px; }
.gcard { align-self: start; padding: 14px; display: grid; gap: 12px; }
.gtitle { font-size: 12px; color: var(--night); background: var(--aqua); padding: 1px 6px; justify-self: start; }
.gq { font-size: 24px; line-height: 1.2; margin: 0; color: var(--ink); overflow-wrap: anywhere; }
.gopts { display: grid; gap: 8px; }
.gopts .btn { text-align: left; }
.gopts .btn.right { background: var(--aqua); color: var(--night); border-color: var(--ink); }
.gopts .btn.wrong { background: var(--pink); color: var(--night); border-color: var(--ink); }
.gopts .btn:disabled { cursor: default; opacity: 1; }
.gexplain { margin: 0; padding: 8px 10px; border-left: 4px solid var(--sun); background: var(--night); }
.gbig { font-size: 36px; line-height: 1; color: var(--sun); margin: 0; }
</style>

<div id="app">
<canvas id="sky" aria-label="Interactive pixel map of the sky above you. Tap a star or planet for facts."></canvas>
<canvas id="labels" aria-hidden="true"></canvas>

<header class="hud">
  <div class="hudrow">
    <button class="chip box" id="loc-chip" title="Change location">Locating…</button>
    <button class="clock box" id="clock" title="Change date and time">
      <span id="clock-time">--:--:--</span>
      <span class="sub"><span id="clock-date"></span><span class="live" id="live-badge">LIVE</span></span>
    </button>
  </div>
  <div class="hudrow"><span class="cond" id="cond"></span></div>
</header>

<div class="status" id="status"></div>
<button class="follow box" id="follow-btn" hidden>TAP SO THE SKY MOVES WITH YOUR PHONE</button>

<nav class="dock" aria-label="Controls">
  <button class="box" id="search-btn" title="Find a star, planet or constellation"><svg viewBox="0 0 12 12" data-ico="3,1,4,1 2,2,1,1 7,2,1,1 1,3,1,4 8,3,1,4 2,7,1,1 7,7,1,1 3,8,4,1 8,8,1,1 9,9,1,1 10,10,1,1"></svg>FIND</button>
  <button class="box" id="play-btn" title="Play the star quiz"><svg viewBox="0 0 12 12" data-ico="5,0,2,3 4,3,4,1 0,4,12,2 1,6,10,1 2,7,8,1 2,8,3,2 7,8,3,2 1,10,2,1 9,10,2,1"></svg>PLAY</button>
  <button class="box" id="layers-btn" title="Choose what the map shows"><svg viewBox="0 0 12 12" data-ico="1,2,10,2 1,5,10,2 1,8,10,2"></svg>LAYERS</button>
  <button class="box" id="compass-btn" aria-pressed="false" title="Aim your phone at the sky"><svg viewBox="0 0 12 12" data-ico="5,0,2,4 5,8,2,4 0,5,4,2 8,5,4,2 5,5,2,2"></svg>POINT</button>
  <button class="box" id="dome-btn" title="Show the whole sky"><svg viewBox="0 0 12 12" data-ico="4,2,4,1 2,3,2,1 8,3,2,1 1,4,1,2 10,4,1,2 0,6,1,3 11,6,1,3 0,9,12,1"></svg>DOME</button>
</nav>

<aside class="sheet box" id="sheet" hidden aria-live="polite">
  <button class="close" id="sheet-close" aria-label="Close">×</button>
  <div id="sheet-body"></div>
</aside>

<div class="dlg" id="dlg-loc" hidden>
  <div class="box">
    <button class="close" data-close aria-label="Close">×</button>

let M = null;
function toHor(x, y, z, out) {   // J2000 equatorial unit vector -> [east, north, up]
  const hx = M[0][0] * x + M[1][0] * y + M[2][0] * z;
  const hy = M[0][1] * x + M[1][1] * y + M[2][1] * z;
  const hz = M[0][2] * x + M[1][2] * y + M[2][2] * z;

}
const azOf = h => (Math.atan2(h[0], h[1]) * R2D + 360) % 360;
const altOf = h => Math.asin(Math.max(-1, Math.min(1, h[2]))) * R2D;

function compute() {
  state.date = state.live ? new Date() : state.custom;
  astroTime = A.MakeTime(state.date);
  observer = new A.Observer(state.loc.lat, state.loc.lon, state.loc.elev || 0);
  M = A.Rotation_EQJ_HOR(astroTime, observer).rot;
  const m = M;
  for (let i = 0; i < N; i++) {
    const x = eqx[i], y = eqy[i], z = eqz[i];
    he[i] = -(m[0][1] * x + m[1][1] * y + m[2][1] * z);
    hn[i] = m[0][0] * x + m[1][0] * y + m[2][0] * z;
    hu[i] = m[0][2] * x + m[1][2] * y + m[2][2] * z;
  }
  CONS.forEach(c => toHor(c.eq[0], c.eq[1], c.eq[2], c.h));
  MW.forEach(p => toHor(p.eq[0], p.eq[1], p.eq[2], p.h));
  BODIES.forEach(b => {
    const eq = A.Equator(A.Body[b.name], astroTime, observer, false, true);
    toHor(eq.vec.x / eq.dist, eq.vec.y / eq.dist, eq.vec.z / eq.dist, b.h);
    b.ra = eq.ra; b.dec = eq.dec; b.dist = eq.dist;
    const il = A.Illumination(A.Body[b.name], astroTime);
    b.mag = il.mag; b.lit = il.phase_fraction;
  });
  state.sunAlt = altOf(BODIES[0].h);
  state.moon = { phase: A.MoonPhase(astroTime), lit: BODIES[1].lit };
  state.lastCompute = new Date();

}

const canvas = $('sky'), ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {

  W = $('app').clientWidth; H = $('app').clientHeight;
  canvas.width = Math.ceil(W / PIX); canvas.height = Math.ceil(H / PIX);
  lab.width = Math.round(W * DPR); lab.height = Math.round(H * DPR);

}
let cr = [1, 0, 0], cu = [0, 0, 1], cf = [0, 1, 0], pscale = 1, PX = 0, PY = 0;
function setCamera() {
  if (state.sensor && sens.basis) { cr = sens.basis.r; cu = sens.basis.u; cf = sens.basis.f; }
  else {
    const az = state.view.az * D2R, alt = state.view.alt * D2R;
    cf = [Math.sin(az) * Math.cos(alt), Math.cos(az) * Math.cos(alt), Math.sin(alt)];
    cr = [Math.cos(az), -Math.sin(az), 0];
    cu = [-Math.sin(az) * Math.sin(alt), -Math.cos(az) * Math.sin(alt), Math.cos(alt)];
  }
  pscale = Math.min(W, H) / 2 / (2 * Math.tan(state.view.fov * D2R / 4));
}
function proj(e, n, u) {   // stereographic; writes PX, PY
  const zc = e * cf[0] + n * cf[1] + u * cf[2];
  if (zc < -0.6) return false;
  const k = 2 * pscale / (1 + zc);
  PX = W / 2 + k * (e * cr[0] + n * cr[1] + u * cr[2]);
  PY = H / 2 - k * (e * cu[0] + n * cu[1] + u * cu[2]);

}

  const a = alt * D2R, z = az * D2R;
  return proj(Math.sin(z) * Math.cos(a), Math.cos(z) * Math.cos(a), Math.sin(a));

/* ---------- drawing: the sky is rasterised on a coarse grid and scaled up without smoothing ---------- */
const PIX = 2;                                   // one sky pixel = 2 CSS px
const lab = $('labels'), lctx = lab.getContext('2d');
const FONT_S = '12px Pix32, monospace', FONT_L = '24px Pix32, monospace';

  const gx = Math.round(x / PIX), gy = Math.round(y / PIX);

}
function pline(x0, y0, x1, y1, gap) {            // Bresenham line on the sky grid; gap 2 = dotted
  let gx0 = Math.round(x0 / PIX), gy0 = Math.round(y0 / PIX);
  const gx1 = Math.round(x1 / PIX), gy1 = Math.round(y1 / PIX), gw = Math.ceil(W / PIX), gh = Math.ceil(H / PIX);
  if ((gx0 < 0 && gx1 < 0) || (gx0 > gw && gx1 > gw) || (gy0 < 0 && gy1 < 0) || (gy0 > gh && gy1 > gh)) return;

function rawProj(e, n, u) {   // like proj, but keeps points far off-screen (for the horizon circle)

  svg.innerHTML = svg.dataset.ico.split(' ').map(r => { const [x, y, w, h] = r.split(','); return `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`; }).join('');
});
document.querySelectorAll('[data-layer]').forEach(b => b.addEventListener('click', () => toggleLayer(b.dataset.layer)));
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { b.closest('.dlg').hidden = true; }));
document.querySelectorAll('.dlg').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.hidden = true; }));
$('sheet-close').addEventListener('click', closeSheet);
$('dome-btn').addEventListener('click', () => { if (state.sensor) setSensor(false); state.view = { az: 180, alt: 90, fov: 204 }; requestRender(); });
$('compass-btn').addEventListener('click', () => setSensor(!state.sensor));
$('search-btn').addEventListener('click', () => { $('dlg-find').hidden = false; $('q').value = ''; renderResults(); $('q').focus(); });
$('q').addEventListener('input', renderResults);

CITIES.forEach((c, i) => { const o = el('option', null, c[0]); o.value = i; $('city').appendChild(o); });
$('loc-chip').addEventListener('click', () => {
  const l = state.loc;
  $('loc-now').textContent = (l.src === 'gps' ? `Using your GPS position, accurate to about ${Math.round(l.acc)} m: ` :
    l.src === 'default' ? `GPS hasn't answered, so this is a guess from your time zone (${l.name}): ` : `Set by hand (${l.name}): `) + coordText(l) + '.';
  $('lat').value = l.lat.toFixed(4); $('lon').value = l.lon.toFixed(4);
  $('dlg-loc').hidden = false;
});
$('gps-btn').addEventListener('click', () => { state.manualLoc = false; gpsWarned = false; if (state.loc.src === 'gps') state.loc.src = 'manual'; startGps(); $('dlg-loc').hidden = true; });
$('city').addEventListener('change', () => { const c = CITIES[+$('city').value]; state.manualLoc = true; setLocation(c[1], c[2], c[0], 'manual'); $('dlg-loc').hidden = true; });
$('coords-btn').addEventListener('click', () => {
  const lat = parseFloat($('lat').value.replace(',', '.')), lon = parseFloat($('lon').value.replace(',', '.'));
  if (!(lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180)) { toast('Latitude must be -90 to 90 and longitude -180 to 180.'); return; }
  state.manualLoc = true; setLocation(lat, lon, coordText({ lat, lon }), 'manual'); $('dlg-loc').hidden = true;
});

function localInput(d) { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
$('clock').addEventListener('click', () => { $('when').value = localInput(state.date); $('dlg-time').hidden = false; });
function applyTime() { const d = new Date($('when').value); if (isNaN(d)) { toast('Pick a date and time first.'); return false; } state.live = false; state.custom = d; compute(); return true; }
$('time-apply').addEventListener('click', () => { if (applyTime()) $('dlg-time').hidden = true; });
document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
  const base = new Date($('when').value); if (isNaN(base)) return;
  $('when').value = localInput(new Date(base.getTime() + (+b.dataset.step) * 60000)); applyTime();
}));
$('time-live').addEventListener('click', () => { state.live = true; state.custom = null; compute(); $('dlg-time').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.querySelectorAll('.dlg').forEach(d => { d.hidden = true; }); } });

/* ---------- quiz game: every question is built from the same facts the sky map shows ---------- */
const PLANET_NUM = {   // diameter km, year in Earth days, one spin in hours, moons (for comparing), moons (as shown)
  Mercury: [4879, 88, 1408, 0, '0'], Venus: [12104, 225, 5832, 0, '0'], Mars: [6779, 687, 24.6, 2, '2'],
  Jupiter: [139820, 4333, 9.9, 100, 'about 100'], Saturn: [116460, 10759, 10.7, 285, 'over 280'],
  Uranus: [50724, 30687, 17.2, 29, 'nearly 30'], Neptune: [49244, 60190, 16.1, 16, '16'],
};
const STAR_COLOUR = { O: 'blue', B: 'blue-white', A: 'white', F: 'yellow-white', G: 'yellow', K: 'orange', M: 'red' };
const QUIZ_STARS = []; for (let i = 0; i < N && smag[i] < 2.6; i++) if (sname[i]) QUIZ_STARS.push(i);
const ROUND = 10, game = { n: 0, score: 0, q: null };
function shuffle(list) { const a = list.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const lyText = ly => fmt(ly, ly < 100 ? 1 : 0) + ' light-years';
const spread = (values, ratio) => { const v = values.slice().sort((a, b) => a - b); for (let k = 1; k < v.length; k++) if (v[k] < v[k - 1] * ratio) return false; return true; };
const bodyIndex = name => BODIES.findIndex(b => b.name === name);

const QUESTIONS = [
  function nearest() {
    const s = shuffle(QUIZ_STARS.filter(i => S[i][4] > 0 && S[i][4] <= 1000)).slice(0, 3), d = s.map(i => S[i][4]);
    if (!spread(d, 1.3)) return null;
    const ans = d.indexOf(Math.min(...d));
    return { topic: 'DISTANCE', q: 'Which of these stars is closest to us?', choices: s.map(i => sname[i]), ans, sel: { kind: 'star', i: s[ans] },
             explain: s.map(i => sname[i] + ': ' + lyText(S[i][4])).join('. ') + '. A light-year is how far light travels in a year.' };
  },
  function brightest() {
    const s = shuffle(QUIZ_STARS).slice(0, 3), m = s.map(i => smag[i]), v = m.slice().sort((a, b) => a - b);
    if (v[1] - v[0] < 0.35) return null;
    const ans = m.indexOf(v[0]);
    return { topic: 'BRIGHTNESS', q: 'Which of these stars looks brightest in our sky?', choices: s.map(i => sname[i]), ans, sel: { kind: 'star', i: s[ans] },
             explain: 'Lower magnitude means brighter. ' + s.map(i => sname[i] + ': ' + smag[i].toFixed(1)).join(', ') + '.' };
  },
  function colour() {
    const i = shuffle(QUIZ_STARS)[0], cls = (S[i][6] || '')[0], right = STAR_COLOUR[cls];
    if (!right) return null;
    const choices = shuffle([right].concat(shuffle(Object.values(STAR_COLOUR).filter(c => c !== right)).slice(0, 3)));
    return { topic: 'COLOUR', q: 'What colour is the star ' + sname[i] + '?', choices, ans: choices.indexOf(right), sel: { kind: 'star', i },
             explain: sname[i] + ' is ' + right + '. Its surface is ' + SPECTRAL[cls][1] + '. Hotter stars look bluer and cooler stars look redder.' };
  },
  function home() {
    const i = shuffle(QUIZ_STARS)[0]; let con;
    try { con = A.Constellation(S[i][0] / 15, S[i][1]).name; } catch (e) { return null; }
    const choices = shuffle([con].concat(shuffle(CONS.map(c => c.name).filter(n => n !== con)).slice(0, 3)));
    return { topic: 'CONSTELLATIONS', q: 'Which constellation is the star ' + sname[i] + ' in?', choices, ans: choices.indexOf(con), sel: { kind: 'star', i },
             explain: sname[i] + ' is in ' + con + ', one of the 88 official constellations.' };
  },
  function upNow() {
    let name, h, sel;
    if (Math.random() < 0.6) { const k = Math.floor(Math.random() * BODIES.length); name = BODIES[k].name; h = BODIES[k].h; sel = { kind: 'body', i: k }; }
    else { const i = shuffle(QUIZ_STARS)[0]; name = sname[i]; h = [he[i], hn[i], hu[i]]; sel = { kind: 'star', i }; }
    const alt = altOf(h);
    if (Math.abs(alt) < 3) return null;
    const where = state.loc.src === 'gps' ? 'where you are' : state.loc.name;
    return { topic: 'THE SKY ' + (state.live ? 'RIGHT NOW' : 'AT YOUR SET TIME'), q: 'From ' + where + ', is ' + (name === 'Sun' || name === 'Moon' ? 'the ' : '') + name + ' above the horizon?',
             choices: ['Yes, it is up', 'No, it is below the horizon'], ans: alt > 0 ? 0 : 1, sel,
             explain: alt > 0 ? name + ' is ' + alt.toFixed(0) + '° above the horizon, toward the ' + compass(azOf(h)) + '.'
                              : name + ' is ' + (-alt).toFixed(0) + '° below your horizon, so the ground is in the way.' };
  },
  function planets() {
    const kinds = [
      ['Which of these planets is the biggest?', 0, Math.max, v => fmt(v) + ' km across'],
      ['Which of these planets is the smallest?', 0, Math.min, v => fmt(v) + ' km across'],
      ['Which of these planets takes longest to go around the Sun?', 1, Math.max, v => v < 1000 ? v + ' days' : (v / 365.25).toFixed(1) + ' years'],
      ['Which of these planets has the shortest year?', 1, Math.min, v => v < 1000 ? v + ' days' : (v / 365.25).toFixed(1) + ' years'],
      ['Which of these planets spins fastest, so has the shortest day?', 2, Math.min, v => v < 100 ? v + ' hours' : Math.round(v / 24) + ' days'],
      ['Which of these planets has the most moons?', 3, Math.max, null],
    ];
    const [q, col, pick, show] = kinds[Math.floor(Math.random() * kinds.length)];
    const names = shuffle(Object.keys(PLANET_NUM)).slice(0, 4), vals = names.map(n => PLANET_NUM[n][col]), best = pick(...vals);
    if (vals.filter(v => v === best).length > 1) return null;
    const ans = vals.indexOf(best);
    return { topic: 'PLANETS', q, choices: names, ans, sel: { kind: 'body', i: bodyIndex(names[ans]) },
             explain: names.map(n => n + ': ' + (show ? show(PLANET_NUM[n][col]) : PLANET_NUM[n][4] + ' moons')).join('. ') + '.' };
  },
  function howFar() {
    const pool = shuffle(QUIZ_STARS.filter(i => S[i][4] > 0 && S[i][4] <= 1000)), i = pool[0], picks = [S[i][4]];
    for (const j of pool.slice(1)) { if (picks.length === 4) break; if (picks.every(d => S[j][4] > d * 1.6 || S[j][4] < d / 1.6)) picks.push(S[j][4]); }
    if (picks.length < 4) return null;
    const choices = shuffle(picks).map(lyText), year = state.date.getFullYear() - Math.round(S[i][4]);
    return { topic: 'DISTANCE', q: 'How far away is the star ' + sname[i] + '?', choices, ans: choices.indexOf(lyText(S[i][4])), sel: { kind: 'star', i },
             explain: sname[i] + ' is ' + lyText(S[i][4]) + ' away, so the light you see tonight left it ' + (year > 0 ? 'around the year ' + year : 'about ' + fmt(Math.round(S[i][4])) + ' years ago') + '.' };
  },
];
function nextQuestion() {
  let q = null, last = game.q && game.q.maker;
  for (let tries = 0; tries < 60 && !q; tries++) {
    const make = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];
    if (make === last && tries < 30) continue;
    q = make(); if (q) q.maker = make;
  }
  game.q = q; game.n++;
  const card = $('g-card'); card.textContent = '';
  $('g-count').textContent = game.n + '/' + ROUND; $('g-score').textContent = game.score;
  card.appendChild(el('span', 'gtitle', q.topic));
  card.appendChild(el('p', 'gq', q.q));
  const opts = el('div', 'gopts');
  q.choices.forEach((text, k) => { const b = el('button', 'btn', text); b.addEventListener('click', () => answer(k)); opts.appendChild(b); });
  card.appendChild(opts);
}
function answer(k) {
  const q = game.q, card = $('g-card'), buttons = card.querySelectorAll('.gopts .btn'), right = k === q.ans;
  buttons.forEach((b, j) => { b.disabled = true; if (j === q.ans) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); });
  if (right) game.score++;
  $('g-score').textContent = game.score;
  card.appendChild(el('p', 'gexplain', (right ? 'Correct! ' : 'Not quite. ') + q.explain));
  const row = el('div', 'row');
  const see = el('button', 'btn', 'SEE IT IN THE SKY'); see.addEventListener('click', () => { $('game').hidden = true; goTo(q.sel); });
  const next = el('button', 'btn primary', game.n >= ROUND ? 'RESULTS' : 'NEXT'); next.addEventListener('click', () => (game.n >= ROUND ? results() : nextQuestion()));
  row.appendChild(see); row.appendChild(next); card.appendChild(row); next.focus();
}
function results() {
  let best = 0; try { best = +localStorage.getItem('sky-quiz-best') || 0; } catch (e) {}
  const record = game.score > best;
  if (record) { best = game.score; try { localStorage.setItem('sky-quiz-best', String(best)); } catch (e) {} }
  const rank = game.score === ROUND ? 'STAR MASTER' : game.score >= 7 ? 'ASTRONOMER' : game.score >= 4 ? 'NAVIGATOR' : 'STARGAZER';
  const card = $('g-card'); card.textContent = '';
  card.appendChild(el('span', 'gtitle', 'ROUND OVER'));
  card.appendChild(el('p', 'gbig', game.score + ' / ' + ROUND));
  card.appendChild(el('p', 'gq', 'Rank: ' + rank));
  card.appendChild(el('p', 'gexplain', (record ? 'New best score on this device! ' : 'Your best on this device is ' + best + '. ') +
    'Every round is different, and the sky questions change with your place and time.'));
  const row = el('div', 'row');
  const again = el('button', 'btn primary', 'PLAY AGAIN'); again.addEventListener('click', startGame);
  const back = el('button', 'btn', 'BACK TO SKY'); back.addEventListener('click', () => { $('game').hidden = true; });
  row.appendChild(again); row.appendChild(back); card.appendChild(row);
}
function startGame() { game.n = 0; game.score = 0; game.q = null; closeSheet(); $('toast').hidden = true; $('game').hidden = false; nextQuestion(); }
$('play-btn').addEventListener('click', startGame);
$('g-exit').addEventListener('click', () => { $('game').hidden = true; });

/* ---------- run ---------- */
function safeCompute() { try { compute(); } catch (e) { console.error(e); toast('Something went wrong recalculating the sky. Retrying…'); } }
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('app'));
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.live) safeCompute(); });
resize(); safeCompute(); startGps();
setInterval(() => { if (state.live) safeCompute(); }, REFRESH_MS);
setInterval(tickClock, 1000);
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(FONT_S), document.fonts.load(FONT_L)]).then(requestRender, requestRender);
try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
window.__sky = { state, sens, BODIES, S, sname, altOf, azOf, hor: i => [he[i], hn[i], hu[i]], compute };
})();
</script>
</body></html>
